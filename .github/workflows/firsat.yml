name: Firsat Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firsat-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fırsatları kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python firsat_bot.py

      - name: seen.json kaydet
        run: |
          git config user.name "firsat-bot"
          git config user.email "firsat-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "seen guncelle" && git push)
